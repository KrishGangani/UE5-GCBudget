; P04 GCBudget - engine configuration.
; Benchmark-relevant keys below restate engine defaults on purpose, so a later change can't silently alter
; frame timing or garbage collection without showing up in a diff (01b_Research_Findings.md section 2).

[/Script/EngineSettings.GameMapsSettings]
; An engine map with a floor and lights; no map has to be authored. Everything else is created by code.
GameDefaultMap=/Engine/Maps/Templates/Template_Default
EditorStartupMap=/Engine/Maps/Templates/Template_Default

[/Script/Engine.Engine]
; No frame-rate smoothing or fixed frame-rate cap: frame time must reflect real work.
bSmoothFrameRate=False
bUseFixedFrameRate=False

[SystemSettings]
; VSync off so Present never blocks the frame.
r.VSync=0

[/Script/Engine.GarbageCollectionSettings]
; The 5.8.4 defaults from BaseEngine.ini (or the C++ default where BaseEngine.ini sets none), restated.
; Benchmark runs change these per run from code, never here, so every configuration starts from the same baseline.
gc.TimeBetweenPurgingPendingKillObjects=61.1
gc.AllowParallelGC=True
gc.IncrementalBeginDestroyEnabled=True
gc.CreateGCClusters=True
gc.AssetClustreringEnabled=False
gc.ActorClusteringEnabled=False
gc.AllowIncrementalReachability=0
gc.AllowIncrementalGather=0

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
